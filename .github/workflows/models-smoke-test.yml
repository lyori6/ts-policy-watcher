# Temporary: checks that GitHub Models works from Actions with the built-in token.
name: 'GitHub Models smoke test'
on:
  push:
    branches: [claude/project-thread-x815dn]
    paths: ['.github/workflows/models-smoke-test.yml']
permissions:
  models: read
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for m in openai/gpt-4.1-mini openai/gpt-4o-mini; do
            echo "== $m"
            curl -s -w "\nHTTP %{http_code}\n" https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Summarize in one sentence: TikTok bans dangerous challenges.\"}]}" | head -c 1200
            echo
          done
