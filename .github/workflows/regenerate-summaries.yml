# Temporary: one-off regeneration of policy summaries using repo secrets (run 2).
name: 'Regenerate summaries (one-off)'
on:
  push:
    branches: [claude/project-thread-x815dn]
    paths: ['.github/workflows/regenerate-summaries.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Regenerate missing summaries
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python scripts/regenerate_summaries.py
      - name: Commit summaries
        run: |
          git config user.name "Policy Watch Bot"
          git config user.email "bot@github.com"
          git add summaries.json
          git diff --staged --quiet || git commit -m "CHORE: Regenerate remaining policy summaries with Workers AI"
          git push origin HEAD:claude/project-thread-x815dn
